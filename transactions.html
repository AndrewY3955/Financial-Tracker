<!DOCTYPE html>
<html>
<head>
<title>Transactions</title>
<link rel="stylesheet" href="assets/css/styles.css">
<script defer src="assets/js/app.js"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header"><h2>FinTrack</h2></div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="index.html">Dashboard</a>
      <a class="nav-item active" href="transactions.html">Transactions</a>
      <a class="nav-item" href="budgets.html">Budgets</a>
      <a class="nav-item" href="investments.html">Investments</a>
      <a class="nav-item" href="goals.html">Goals</a>
      <a class="nav-item" href="settings.html">Settings</a>
    </nav>
  </aside>

  <main class="main">

    <div class="main-header">
      <h1>Transactions</h1>
    </div>

    <div class="card">
      <form onsubmit="addTransaction(event)">
        <input id="title" placeholder="Transaction Title" required>
        <input id="amount" type="number" placeholder="Amount" required>
        <input id="date" type="date" required>
        <select id="category">
          <option>Food</option>
          <option>Rent</option>
          <option>Utilities</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
        <button>Add Transaction</button>
      </form>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Title</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Other</th>
          </tr>
        </thead>
        <tbody id="transactionTable"></tbody>
      </table>
    </div>

  </main>
</div>

</body>
</html>
