<!DOCTYPE html>
<html>
<head>
<title>Budgets</title>
<link rel="stylesheet" href="/css/styles.css">
<script defer src="/js/app.js"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header"><h2>FinTrack</h2></div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="index.html">Dashboard</a>
      <a class="nav-item" href="transactions.html">Transactions</a>
      <a class="nav-item active" href="budgets.html">Budgets</a>
      <a class="nav-item" href="investments.html">Investments</a>
      <a class="nav-item" href="goals.html">Goals</a>
      <a class="nav-item" href="settings.html">Settings</a>
    </nav>
  </aside>

  <main class="main">

    <div class="main-header">
      <h1>Budgets</h1>
    </div>

    <div class="card">
      <form onsubmit="addBudget(event)">
        <input type="text" id="budgetCategory" placeholder="Budget Category" required>
        <input type="number" id="budgetLimit" placeholder="Amount" required>
        <button type="submit">Create Budget</button>
      </form>
    </div>

    <div class="card">
      <form onsubmit="removeBudget(event)">
        <select id="budgetSelect" required>
          <option value="" selected>Select Budget</option>
        </select>
        <button type="submit">Remove Budget</button>
      </form>
    </div>

    <div class="card">
      <h3>Current Budgets</h3>
      <div id="budgetList"></div>
    </div>

  </main>
</div>

</body>
</html>
