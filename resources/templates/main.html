<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="/css/styles.css">
<script defer src="/js/app.js"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header"><h2>Financial Tracker</h2></div>
    <nav class="sidebar-nav">
      <a class="nav-item active" href="/dashboard">Dashboard</a>
      <a class="nav-item" href="/transactions">Transactions</a>
      <a class="nav-item" href="/budgets">Budgets</a>
      <a class="nav-item" href="/investments">Investments</a>
      <a class="nav-item" href="/goals">Goals</a>
      <a class="nav-item" href="/settings">Settings</a>
    </nav>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1>Dashboard</h1>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card"><span>Available Funds</span><h2 id="availableFunds"></h2>
      </div>
      <div class="kpi-card"><span>Monthly Expenses</span><h2 id="expenses"></h2>

      </div>
      <div class="kpi-card"><span>Goals</span><h2>Coming Soon</h2>

      </div>
      <div class="kpi-card"><span>Investments</span><h2>Coming Soon</h2>

      </div>
    </div>

  </main>
</div>

</body>
</html>
